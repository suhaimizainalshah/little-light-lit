<!doctype html>

<head>

<title>Little Light Lit Present: zooming, interactive presentations</title>
<meta name="description" content="Make zooming presentations with interactive buttons, pop-ups and your own path. Present full screen or download one HTML file. Free and private.">
<link rel="icon" href="assets/logo.png" type="image/png">
<link rel="stylesheet" href="assets/fonts.css">
<link rel="stylesheet" href="assets/littlelightlit.css">
<style>
body{overflow:hidden}
.pr{display:grid;grid-template-columns:240px minmax(0,1fr) 280px;height:calc(100vh - 58px)}
@media (max-width:980px){body{overflow:auto}.pr{grid-template-columns:1fr;height:auto}.cv{height:70vh}}
.side,.insp{overflow:auto;padding:12px;background:var(--panel,#fff);border-right:1px solid var(--line,#e3e1db)}.insp{border-right:0;border-left:1px solid var(--line,#e3e1db)}
h2.s{font-size:.78rem;color:var(--muted,#5b616a);margin:14px 0 6px}h2.s:first-child{margin-top:0}
.path{list-style:none;margin:0;padding:0;display:grid;gap:5px}.path li{display:flex;align-items:center;gap:4px;padding:5px 6px;border:1px solid var(--line,#e3e1db);border-radius:10px;background:var(--paper,#fff);font-size:13px}
.path li[aria-current=true]{border-color:var(--accent,#c23a22);box-shadow:inset 3px 0 0 var(--accent,#c23a22)}.path li b{width:20px;text-align:center;color:var(--muted,#5b616a)}.path li button.nm{flex:1;min-width:0;text-align:left;border:0;background:none;font:inherit;color:inherit;cursor:pointer;padding:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ib{border:1px solid var(--line,#e3e1db);background:transparent;border-radius:7px;width:26px;height:26px;cursor:pointer;color:inherit;font-size:12px;padding:0}.ib:disabled{opacity:.35}
.cv{position:relative;overflow:hidden;background:var(--soft,#f1efea);touch-action:none}
.cvbar{position:absolute;z-index:5;left:12px;top:12px;right:12px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;pointer-events:none}.cvbar>*{pointer-events:auto}
.cvbar .pill{background:var(--panel,#fff);border:1px solid var(--line,#e3e1db);border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:650}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
.ef{position:absolute;width:1600px;height:900px;transform-origin:0 0;border-radius:18px;box-shadow:0 8px 30px rgba(0,0,0,.14);overflow:hidden;cursor:move}
.ef.sel{outline:12px solid #2453d6;outline-offset:6px}.ef .lbl{position:absolute;left:0;bottom:100%;margin-bottom:14px;font:800 44px system-ui;color:var(--muted,#5b616a);white-space:nowrap}
.ef .num{position:absolute;right:24px;top:20px;width:70px;height:70px;border-radius:50%;background:#2453d6;color:#fff;font:800 36px system-ui;display:grid;place-items:center;z-index:3}
.ef.off .num{background:#8a8f98}.handle{position:absolute;right:-14px;bottom:-14px;width:44px;height:44px;border-radius:50%;background:#2453d6;border:6px solid #fff;cursor:nwse-resize;z-index:4}
.fe .pp-item{cursor:move;outline:2px dashed rgba(36,83,214,.0)}.fe .pp-item:hover{outline-color:rgba(36,83,214,.35)}.fe .pp-item.sel{outline:4px solid #2453d6;outline-offset:2px}.fe .ih{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:#2453d6;border:4px solid #fff;cursor:nwse-resize;z-index:6}
.fld{display:grid;gap:3px;margin:6px 0}.fld>span{font-size:12px;font-weight:650;color:var(--muted,#5b616a)}
.fld input,.fld select,.fld textarea{font:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--line,#e3e1db);border-radius:8px;background:var(--paper,#fff);color:inherit;width:100%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:6px}.row{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}.mini{padding:5px 10px;font-size:12.5px}.hint{font-size:12px;color:var(--muted,#5b616a);margin:4px 0}
.chk{display:flex;gap:6px;align-items:center;font-size:13px;margin:6px 0}
.ovl{position:fixed;inset:0;z-index:2000;background:rgba(0,0,0,.55);display:grid;place-items:center;padding:20px}.ovl .box{background:var(--paper,#fff);color:inherit;border-radius:14px;max-width:760px;width:100%;max-height:90vh;overflow:auto}
.ovl .bar{display:flex;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line,#e3e1db)}.ovl .in{padding:14px}
.pp-show{position:fixed;inset:0;z-index:2100;background:#000} /* not ".show": the studio menu uses that name */
.top #presentBtn{background:#b42e18;border-color:#b42e18;color:#fff}
code.emb{display:block;white-space:pre-wrap;word-break:break-all;background:var(--soft,#f1efea);padding:10px;border-radius:8px;font-size:12px}
.start{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:10px}.start button{display:grid;gap:4px;text-align:left;padding:14px;border:1px solid var(--line,#e3e1db);border-radius:12px;background:var(--panel,#fff);font:inherit;color:inherit;cursor:pointer}.start button:hover{border-color:var(--accent,#c23a22)}.start small{color:var(--muted,#5b616a)}
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="./" aria-label="Little Light Lit home"><img src="assets/logo.png" alt="" width="28" height="28"><span>Little Light Lit</span></a>
  <nav class="modes" aria-label="Studios"><a href="./">Photo</a><a href="./#batch" class="m-hide">Many photos</a><a href="photobooth.html">Photo booth</a><a href="design.html">Design</a><a href="video.html">Video</a><a href="gif.html">Screen &amp; GIF</a><a href="audio.html">Audio</a><a href="animate.html">Animate</a><a href="lesson.html">Lessons</a><a href="course.html">Course</a><a href="motion.html">Motion</a><a href="present.html" aria-current="page">Present</a><a href="360.html">360°</a><a href="3d.html">3D</a></nav>

</header>
<main class="pr">
  <aside class="side" aria-label="Presentation and path">
    <label class="fld"><span>Presentation name</span><input id="pTitle"></label>
    <div class="two"><label class="fld"><span>Canvas colour</span><input type="color" id="pBg"></label><label class="fld"><span>Start with</span><select id="pStart"><option value="first">The first frame</option><option value="overview">The overview</option></select></label></div>
    <h2 class="s">Path</h2><p class="hint">The order of your presentation. Frames off the path are reached only by buttons.</p>
    <ol class="path" id="path"></ol>
    <div class="row"><button class="btn mini" id="addFrame">Add frame</button><button class="btn mini" id="addPptx">Add slides from PowerPoint</button></div><input type="file" id="pptxIn" accept=".pptx,application/vnd.openxmlformats-officedocument.presentationml.presentation" hidden>

  </aside>
  <section class="cv" id="cv" aria-label="Canvas">
    <div class="cvbar" id="cvbar"></div>
    <div id="world"></div>
  </section>
  <aside class="insp" id="insp" aria-label="Inspector"></aside>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="assets/littlelightlit-ux.js"></script>
<script src="assets/nav.js"></script>
<script src="vendor/jszip/jszip.min.js"></script>
<script src="assets/present-player.js"></script>
<script>
/* Little Light Lit Present editor. The presentation (P) is plain data; assets/present-player.js presents it here and in
   every download, so what you present is what others see. Everything stays on this device. */
const $ = s => document.querySelector(s), uid = () => Math.random().toString(36).slice(2, 9), FW = 1600, FH = 900;
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const toast = (t, ms = 3200) => { const e = $("#toast"); e.textContent = t; e.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove("show"), ms); };
if (!document.getElementById("pp-css")) { const st = document.createElement("style"); st.id = "pp-css"; st.textContent = LLLPresent.css; document.head.append(st); }
const DRAFT = "littlelightlit-present-draft";
let P, fsel = null, isel = null, editing = null, cam = { x: 0, y: 0, k: .2 };
const frame = id => P.frames.find(f => f.id === id), item = () => editing?.items.find(i => i.id === isel);
function newFrame(name, x, y, w = 1600, bg = "#ffffff") { return { id: uid(), name, x, y, w, bg, items: [{ id: uid(), kind: "heading", text: name, x: 120, y: 110, w: 1360, h: 160, size: 80, color: "#18191c", align: "left" }] }; }
function blank() { const f = newFrame("Title", 0, 0); return { title: "Untitled presentation", canvasBg: "#f1efea", frames: [f], path: [f.id] }; }
function sample() {
  const big = { id: uid(), name: "Welcome", x: 0, y: 0, w: 4800, bg: "#1b2a49", items: [{ id: uid(), kind: "heading", text: "Our school garden", x: 160, y: 300, w: 1280, h: 180, size: 110, color: "#ffffff" }, { id: uid(), kind: "text", text: "A zooming tour. Use the buttons, or press → to follow the path.", x: 260, y: 500, w: 1080, h: 120, size: 38, color: "#cfd8ea" }] };
  const menu = { id: uid(), name: "Explore", x: 5400, y: 0, w: 1600, bg: "#ffffff", items: [{ id: uid(), kind: "heading", text: "Choose what to explore", x: 120, y: 90, w: 1360, h: 140, size: 70, color: "#18191c" }] };
  const topics = [["Plants", "#2f855a", "We grow kangkung, chilli and pandan."], ["Water", "#2453d6", "Rainwater tanks water the garden."], ["Bees", "#b7791f", "Flowers bring pollinators."]].map(([n, c, body], i) => ({ id: uid(), name: n, x: 5400 + i * 1900, y: 1300, w: 1600, bg: "#ffffff", items: [{ id: uid(), kind: "heading", text: n, x: 120, y: 90, w: 1360, h: 140, size: 80, color: c }, { id: uid(), kind: "text", text: body, x: 120, y: 280, w: 900, h: 240, size: 44, color: "#33363c", align: "left" }, { id: uid(), kind: "hotspot", text: "+", x: 1180, y: 330, w: 110, h: 110, size: 60, tooltip: "Click for a fun fact", action: { do: "popup" }, popup: { title: `${n}: a fun fact`, body: i === 0 ? "Pandan leaves can grow up to **one metre** long." : i === 1 ? "One rainy afternoon can fill a **200-litre** tank." : "A single bee visits up to **5,000** flowers a day." } }, { id: uid(), kind: "button", text: "← Back to the menu", x: 120, y: 700, w: 520, h: 110, size: 36, fill: c, color: "#ffffff", action: { do: "goto", target: menu.id } }] }));
  topics.forEach((t, i) => menu.items.push({ id: uid(), kind: "button", text: t.name, x: 120 + i * 470, y: 380, w: 420, h: 220, size: 52, fill: ["#2f855a", "#2453d6", "#b7791f"][i], color: "#ffffff", radius: 26, action: { do: "goto", target: t.id } }));
  menu.items.push({ id: uid(), kind: "button", text: "Finish the tour →", x: 1020, y: 720, w: 460, h: 100, size: 34, fill: "#18191c", color: "#ffffff", action: { do: "goto", target: "" } });
  const end = { id: uid(), name: "Thank you", x: 1600, y: 2900, w: 1600, bg: "#fff4dc", items: [{ id: uid(), kind: "heading", text: "Thank you!", x: 120, y: 300, w: 1360, h: 200, size: 120, color: "#c23a22" }] };
  menu.items[menu.items.length - 1].action.target = end.id;
  return { title: "Our school garden", canvasBg: "#e9eef5", frames: [big, menu, ...topics, end], path: [big.id, menu.id, ...topics.map(t => t.id), end.id] };
}
let saveT = 0; const changed = () => { clearTimeout(saveT); saveT = setTimeout(() => { try { localStorage.setItem(DRAFT, JSON.stringify(P)); } catch { toast("Too large to keep as a draft in the browser: use Save.", 5000); } }, 400); };
const download = (blob, name) => { const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); };
const slug = s => (s || "presentation").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 50) || "presentation";

/* ---------- canvas: pan, zoom, move and resize frames ---------- */
const applyCam = () => { $("#world").style.transform = `translate(${cam.x}px,${cam.y}px) scale(${cam.k})`; };
function fitAll() { if (!P.frames.length) return; const cv = $("#cv"), x0 = Math.min(...P.frames.map(f => f.x)), y0 = Math.min(...P.frames.map(f => f.y)), x1 = Math.max(...P.frames.map(f => f.x + f.w)), y1 = Math.max(...P.frames.map(f => f.y + f.w * FH / FW)), k = Math.min((cv.clientWidth - 80) / (x1 - x0), (cv.clientHeight - 120) / (y1 - y0)); cam = { k, x: (cv.clientWidth - (x1 - x0) * k) / 2 - x0 * k, y: (cv.clientHeight - (y1 - y0) * k) / 2 - y0 * k + 20 }; applyCam(); }
function fitFrame(f) { const cv = $("#cv"), h = f.w * FH / FW, k = Math.min((cv.clientWidth - 60) / f.w, (cv.clientHeight - 110) / h); cam = { k, x: (cv.clientWidth - f.w * k) / 2 - f.x * k, y: (cv.clientHeight - h * k) / 2 - f.y * k + 22 }; applyCam(); }
function drawCanvas() {
  const w = $("#world"); w.innerHTML = ""; const order = new Map(P.path.map((id, i) => [id, i + 1]));
  P.frames.forEach(f => { const el = document.createElement("div"); el.className = "ef" + (f.id === fsel ? " sel" : "") + (order.has(f.id) ? "" : " off") + (editing?.id === f.id ? " fe" : ""); el.dataset.id = f.id; el.style.cssText = `left:${f.x}px;top:${f.y}px;transform:scale(${f.w / FW});background:${f.bg}`;
    if (editing && editing.id !== f.id) el.style.opacity = ".35";
    if (!editing) el.innerHTML = `<div class="lbl">${esc(f.name)}</div><div class="num" title="${order.has(f.id) ? "Position in the path" : "Off the path"}">${order.get(f.id) || "–"}</div>`;
    f.items.forEach(it => { const e = LLLPresent.item(it); e.dataset.iid = it.id; if (editing?.id === f.id && it.id === isel) e.classList.add("sel"); el.append(e);
      if (editing?.id === f.id) { e.onpointerdown = ev => dragItem(ev, f, it, e); e.ondblclick = ev => { ev.stopPropagation(); if (["heading", "text", "button", "shape", "shape-circle"].includes(it.kind)) { const t = prompt("Text", it.text); if (t != null) { it.text = t; changed(); all(); } } }; } });
    if (editing?.id === f.id) { const it = item(); if (it) { const hd = document.createElement("div"); hd.className = "ih"; hd.style.left = it.x + it.w + "px"; hd.style.top = it.y + it.h + "px"; hd.onpointerdown = ev => resizeItem(ev, it, f); el.append(hd); } }
    if (!editing) { const hd = document.createElement("div"); hd.className = "handle"; hd.title = "Drag to resize"; hd.style.transform = `scale(${FW / f.w})`; hd.style.transformOrigin = "100% 100%"; hd.onpointerdown = ev => resizeFrame(ev, f); el.append(hd);
      el.onpointerdown = ev => dragFrame(ev, f, el); el.ondblclick = () => editFrame(f); }
    w.append(el); });
  drawBar(); applyCam();
}
function dragFrame(ev, f, el) { if (ev.target.classList.contains("handle")) return; ev.preventDefault(); ev.stopPropagation(); const sx = ev.clientX, sy = ev.clientY, ox = f.x, oy = f.y; let moved = false; el.setPointerCapture(ev.pointerId);
  el.onpointermove = m => { const dx = (m.clientX - sx) / cam.k, dy = (m.clientY - sy) / cam.k; if (Math.abs(dx) + Math.abs(dy) > 4 / cam.k) moved = true; if (moved) { f.x = Math.round(ox + dx); f.y = Math.round(oy + dy); el.style.left = f.x + "px"; el.style.top = f.y + "px"; } };
  // a second click within 400 ms opens the frame: detected here because each click redraws the canvas
  el.onpointerup = () => { el.onpointermove = null; fsel = f.id; isel = null; if (moved) { changed(); all(); return; } if (tap.id === f.id && Date.now() - tap.t < 400) { tap = {}; return editFrame(f); } tap = { id: f.id, t: Date.now() }; all(); }; }
let tap = {};
function resizeFrame(ev, f) { ev.preventDefault(); ev.stopPropagation(); const sx = ev.clientX, ow = f.w, t = ev.target; t.setPointerCapture(ev.pointerId); t.onpointermove = m => { f.w = Math.max(400, Math.round(ow + (m.clientX - sx) / cam.k)); drawCanvas(); }; t.onpointerup = () => { t.onpointermove = null; changed(); all(); }; }
function dragItem(ev, f, it, e) { ev.preventDefault(); ev.stopPropagation(); const k = cam.k * f.w / FW, sx = ev.clientX, sy = ev.clientY, ox = it.x, oy = it.y; let moved = false; e.setPointerCapture(ev.pointerId);
  e.onpointermove = m => { const dx = (m.clientX - sx) / k, dy = (m.clientY - sy) / k; if (Math.abs(dx) + Math.abs(dy) > 3) moved = true; if (moved) { it.x = Math.round(Math.max(-it.w / 2, Math.min(FW - it.w / 2, ox + dx))); it.y = Math.round(Math.max(-it.h / 2, Math.min(FH - it.h / 2, oy + dy))); e.style.left = it.x + "px"; e.style.top = it.y + "px"; } };
  e.onpointerup = () => { e.onpointermove = null; isel = it.id; if (moved) { changed(); all(); return; }
    if (tap.id === it.id && Date.now() - tap.t < 400 && ["heading", "text", "button", "shape", "shape-circle", "hotspot"].includes(it.kind)) { tap = {}; const t = prompt("Text", it.text); if (t != null) { it.text = t; changed(); } all(); return; } tap = { id: it.id, t: Date.now() }; all(); }; }
function resizeItem(ev, it, f) { ev.preventDefault(); ev.stopPropagation(); const k = cam.k * f.w / FW, sx = ev.clientX, sy = ev.clientY, ow = it.w, oh = it.h, t = ev.target; t.setPointerCapture(ev.pointerId); t.onpointermove = m => { it.w = Math.max(40, Math.round(ow + (m.clientX - sx) / k)); it.h = Math.max(40, Math.round(oh + (m.clientY - sy) / k)); if (it.kind === "hotspot") it.h = it.w; drawCanvas(); }; t.onpointerup = () => { t.onpointermove = null; changed(); all(); }; }
const cv = $("#cv");
cv.addEventListener("pointerdown", ev => { if (ev.target !== cv && ev.target.id !== "world") return; if (!editing) { fsel = null; } isel = null; all(); const sx = ev.clientX, sy = ev.clientY, ox = cam.x, oy = cam.y; cv.setPointerCapture(ev.pointerId); cv.onpointermove = m => { cam.x = ox + m.clientX - sx; cam.y = oy + m.clientY - sy; applyCam(); }; cv.onpointerup = () => cv.onpointermove = null; });
cv.addEventListener("wheel", ev => { ev.preventDefault(); const r = cv.getBoundingClientRect(), mx = ev.clientX - r.left, my = ev.clientY - r.top, f = Math.exp(-ev.deltaY * .0015), k = Math.max(.02, Math.min(3, cam.k * f)); cam.x = mx - (mx - cam.x) * k / cam.k; cam.y = my - (my - cam.y) * k / cam.k; cam.k = k; applyCam(); }, { passive: false });
function editFrame(f) { editing = f; fsel = f.id; isel = null; all(); fitFrame(f); }
function drawBar() { const b = $("#cvbar"); b.innerHTML = "";
  if (editing) { b.innerHTML = `<button class="btn mini" data-b="back">← All frames</button><span class="pill">Editing: ${esc(editing.name)}</span>`; [["heading", "Heading"], ["text", "Text"], ["image", "Picture"], ["shape", "Box"], ["shape-circle", "Circle"], ["button", "Button"], ["hotspot", "Hotspot"]].forEach(([k, l]) => b.insertAdjacentHTML("beforeend", `<button class="btn mini" data-add="${k}">+ ${l}</button>`)); }
  else b.innerHTML = `<button class="btn mini" data-b="fit">Fit all</button><span class="pill">Drag frames to arrange them · drag a corner to resize · double-click to edit · scroll to zoom</span>`;
  b.onclick = async e => { const x = e.target.closest("[data-b]")?.dataset.b, k = e.target.closest("[data-add]")?.dataset.add; if (x === "back") { editing = null; isel = null; all(); fitAll(); } if (x === "fit") fitAll(); if (k) await addItem(k); }; }
async function addItem(k) { const f = editing, it = { id: uid(), kind: k, text: { heading: "Heading", text: "Your text", button: "Button", hotspot: "+", shape: "", "shape-circle": "" }[k] ?? "", x: 600, y: 330, w: k === "hotspot" ? 110 : k === "heading" ? 900 : k === "text" ? 700 : 400, h: k === "hotspot" ? 110 : k === "heading" ? 140 : 200, size: k === "heading" ? 72 : k === "hotspot" ? 60 : 40, color: k === "button" ? "#ffffff" : "#18191c", fill: k === "button" ? "#2453d6" : k.startsWith("shape") ? "#f6c744" : "", align: "center" };
  if (k === "button") it.action = { do: "next" }; if (k === "hotspot") { it.action = { do: "popup" }; it.popup = { title: "More about this", body: "Write the details here." }; it.tooltip = "Click to find out more"; }
  if (k === "image") { const src = await new Promise(res => { const i = document.createElement("input"); i.type = "file"; i.accept = "image/*"; i.onchange = async () => { const fl = i.files[0]; if (!fl) return res(null); const kind = await LightLitSniff(fl); if (!LightLitPhotoKinds.has(kind)) { toast(LightLitWhyNot(fl.name, kind)); return res(null); } const bmp = await createImageBitmap(fl), sc = Math.min(1, 1600 / Math.max(bmp.width, bmp.height)), c = document.createElement("canvas"); c.width = bmp.width * sc; c.height = bmp.height * sc; c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height); res(c.toDataURL("image/jpeg", .86)); }; i.click(); }); if (!src) return; it.src = src; it.w = 700; it.h = 450; }
  f.items.push(it); isel = it.id; changed(); all(); }

/* ---------- path panel ---------- */
function drawPath() {

function overlay(title, inner) { const o = document.createElement("div"); o.className = "ovl"; o.innerHTML = `<div class="box" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="bar"><b>${esc(title)}</b><span style="flex:1"></span><button class="btn" data-close>Close</button></div><div class="in">${inner}</div></div>`; document.body.append(o); const close = () => { o.remove(); removeEventListener("keydown", k); }, k = e => { if (e.key === "Escape") close(); }; addEventListener("keydown", k); o.querySelector("[data-close]").onclick = close; o.onclick = e => { if (e.target === o) close(); }; o.querySelector("[data-close]").focus(); return o; }
